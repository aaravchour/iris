<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: file:">
    <title>Hermes Deck</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="deck.css">
  </head>
  <body>
    <div class="deck-panel" id="panel">
      <div class="deck-head" id="head">
        <span class="glyph" aria-hidden="true">▁▂▄▂▁</span>
        <span class="title">HERMES DECK</span>
        <span class="clock-badge" id="clock">--:--:--</span>
      </div>
      <div class="deck-body" id="cards"></div>
      <div class="deck-foot">
        <span class="deck-summary" id="summary"></span>
        <span class="hb" id="hb"><span class="hb-dot"></span><span id="hb-label">heartbeat</span></span>
      </div>
    </div>
    <script src="deck.js"></script>
  </body>
</html>
